# ======================
# DATABASE CONFIG (SQLite)
# ======================

# Increase timeout so threads wait for the lock instead of failing immediately
spring.datasource.hikari.connection-init-sql=PRAGMA journal_mode=WAL; PRAGMA synchronous=NORMAL;
spring.datasource.hikari.idle-timeout=10000
spring.datasource.hikari.maximum-pool-size=1

spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.url=jdbc:sqlite:bot_data.db

spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# ======================
# SPRING CONFIG
# ======================

server.port=8080
logging.level.com.example=DEBUG
